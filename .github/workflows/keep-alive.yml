name: Streamlit Keep Alive

on:
  schedule:
    # Se ejecuta cada 6 horas automáticamente
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # Reemplaza la URL con la dirección exacta de tu app en Streamlit Cloud
          curl -I https://escucha-social.streamlit.app/
